    CreateTransactionRequest:
      type: object
      additionalProperties: false
      required: [description, transactionDate, amountUsd]
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 50
          pattern: '^[^\u0000]*$'
          description: Must contain at least one non-whitespace character and must not contain U+0000.
          example: Business lunch
        transactionDate:
          type: string
          format: date
          pattern: '^(?!0000)[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Real calendar date in yyyy-MM-dd format, from 0001-01-01 through 9999-12-31.
        amountUsd:
          type: number
          minimum: 0.005
          maximum: 99999999999999999.99
          description: Rounded to cents using HALF_UP before storage; must remain positive after rounding.
          example: 10.005
    Transaction:
      type: object
      required: [id, description, transactionDate, amountUsd]
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
          maxLength: 50
        transactionDate:
          type: string
          format: date
        amountUsd:
          type: number
          description: Original stored USD amount rounded to cents.
          example: 10.01
    ConvertedTransaction:
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          required: [currency, exchangeRate, exchangeRateDate, exchangeRateEffectiveDate, convertedAmount]
          properties:
            currency:
              $ref: '#/components/schemas/Currency'
            exchangeRate:
              type: number
              description: Target currency units per USD.
              example: 1.37
            exchangeRateDate:
              type: string
              format: date
              description: Treasury record_date.
            exchangeRateEffectiveDate:
              type: string
              format: date
              description: Treasury effective_date.
            convertedAmount:
              type: number
              description: Converted amount rounded to two decimal places using HALF_UP.
              example: 13.71
    Problem:
      type: object
      required: [type, title, status, detail, code]
      properties:
        type:
          type: string
          example: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - INVALID_REQUEST
            - TRANSACTION_NOT_FOUND
            - EXCHANGE_RATE_NOT_FOUND
            - TREASURY_INVALID_RESPONSE
            - TREASURY_UNAVAILABLE
            - INTERNAL_ERROR
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
  responses:
    BadRequest:
      description: Invalid request body, date, amount, UUID, or currency parameter
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Transaction not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
