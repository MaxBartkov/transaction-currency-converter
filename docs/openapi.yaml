openapi: 3.0.3
info:
  title: Transaction Currency Converter
  version: 1.0.0
  description: Persist USD transactions and convert them using historical U.S. Treasury exchange rates.
servers:
  - url: /
paths:
  /api/v1/transactions:
    post:
      operationId: createTransaction
      summary: Store a transaction in USD
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
            example:
              description: Business lunch
              transactionDate: '2024-06-30'
              amountUsd: 10.005
      responses:
        '201':
          description: Transaction stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/transactions/{id}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: getTransaction
      summary: Retrieve the original USD transaction
      responses:
        '200':
          description: Stored transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/transactions/{id}/conversion:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    get:
      operationId: convertTransaction
      summary: Convert using the latest eligible rate within six calendar months
      description: >-
        Uses the latest record_date in the inclusive interval [transactionDate minus six months, transactionDate].
        Only amendments with effective_date on or before the transaction date are eligible.
        Multiplies the stored USD amount by the rate and rounds to two decimal places using HALF_UP.
      parameters:
        - in: query
          name: currency
          required: true
          description: Currency enum constant or exact Treasury country_currency_desc; ISO codes are not accepted.
          schema:
            oneOf:
              - $ref: '#/components/schemas/CurrencyCode'
              - $ref: '#/components/schemas/Currency'
          example: CANADA_DOLLAR
      responses:
        '200':
          description: Transaction with conversion details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConvertedTransaction'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: No eligible exchange rate; transaction cannot be converted to the target currency
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: about:blank
                title: Unprocessable Entity
                status: 422
                detail: 'Transaction cannot be converted to Austria-Schilling: no exchange rate between 2023-12-30 and 2024-06-30 (inclusive)'
                code: EXCHANGE_RATE_NOT_FOUND
                instance: /api/v1/transactions/6b494e4a-9d3d-4af5-8f70-c114cbfabf64/conversion
        '502':
          description: Treasury returned an invalid response
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Treasury is unavailable, timed out, or returned 429 or 5xx
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
